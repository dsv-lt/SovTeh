name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU PyTorch + project)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check src tests agents_comparison.py --line-length 105

      - name: Run unit and integration tests
        env:
          CLASSIFIER_BACKEND: baseline
        run: pytest tests -v -k "not test_live_e2e and not test_baseline_and_lora"
